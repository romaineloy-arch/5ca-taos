<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Au bout du fil — Novelys, l'appel téléphonique, niveau 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --card:#FFFFFF; --ink:#1A2740; --muted:#56627A; --line:#CBD3E0;
  --navy:#1F3A63; --navy-ink:#FFFFFF; --orange:#E07B2E; --orange-soft:#FCEBDD;
  --mots:#2F6FB0; --voix:#8A5CC2; --meth:#1F8A70;
  --ok:#237A4B; --ok-bg:#E3F3E8; --mid:#8A6100; --mid-bg:#FFF1CF; --err:#B3261E; --err-bg:#FBE6E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#10182A; --card:#1A2439; --ink:#E6EBF4; --muted:#9FAAC0; --line:#33415C; --navy:#2A4C80; --orange-soft:#3F2A18; --mots:#7FB2E6; --voix:#C0A0EA; --meth:#5CC9A7; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
}
:root[data-theme="dark"]{ --bg:#10182A; --card:#1A2439; --ink:#E6EBF4; --muted:#9FAAC0; --line:#33415C; --navy:#2A4C80; --orange-soft:#3F2A18; --mots:#7FB2E6; --voix:#C0A0EA; --meth:#5CC9A7; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.12;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input[type=text],select{padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);max-width:100%;width:100%}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:18px 18px 40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;color:var(--navy)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo{color:#9DB9E6} }
.logo::before{content:"";display:inline-block;width:10px;height:10px;background:var(--orange);margin-right:6px;vertical-align:4px}
.logo small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:12px;color:var(--orange);letter-spacing:.08em;text-transform:uppercase}
.tag{background:var(--navy);color:var(--navy-ink);font-size:14px;font-weight:700;padding:4px 12px;border-radius:20px}
.gauges{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.g{flex:1;min-width:150px}
.g b{font-size:13px;display:flex;justify-content:space-between}
.g .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.g .fi{height:100%;width:0;transition:width .5s}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.hero{background:var(--navy);color:var(--navy-ink);border:0}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:800}
.hero h1 span{color:var(--orange)}
.hero p{max-width:64ch}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.three div{border-radius:8px;padding:12px 14px;color:#fff}
.three strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:21px}
.three p{margin:4px 0 0;font-size:15.5px}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.caller{position:sticky;top:12px;border-radius:12px;padding:18px;background:var(--navy);color:var(--navy-ink)}
.caller .lbl{font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.08em}
.caller .who{font-family:"Bricolage Grotesque",sans-serif;font-size:23px;font-weight:800;line-height:1.1;margin:4px 0}
.caller .num{font-family:"JetBrains Mono",monospace;color:#F5B27A}
.caller .clock{font-family:"JetBrains Mono",monospace;font-size:26px;color:var(--orange);margin-bottom:10px}
.mood{height:10px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;margin:12px 0 4px}
.mood div{height:100%;transition:width .6s,background .6s}
.step-n{font-size:14px;opacity:.8;margin-top:10px}

.ringer{text-align:center;padding:28px 10px}
.phone{font-size:62px;display:inline-block}
.ringing .phone{animation:shake .45s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.rings{display:flex;gap:8px;justify-content:center;margin:12px 0 18px}
.rings span{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.rings span.on{background:var(--orange);border-color:var(--orange)}
.rings span.limit{outline:2px dashed var(--err);outline-offset:3px}
.big{font-size:22px;padding:16px 34px;border-radius:40px}

.said{border-left:5px solid var(--orange);background:var(--bg);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:16px}
.said p{margin:0 0 6px}
.said .quote{font-size:20px;font-weight:700}
.said .ctx{font-style:italic;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col h3{font-size:19px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col h3 i{font-style:normal;font-size:12px;font-family:"Atkinson Hyperlegible",sans-serif;color:#fff;padding:2px 8px;border-radius:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:9px;cursor:pointer;background:var(--card);font-size:16.5px}
.opt:hover{border-color:var(--orange)}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt.best{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--err)}
.btn{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:12px 22px;font-weight:700;font-size:18px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.fb{border-radius:8px;padding:14px 16px;margin-top:14px}
.fb.good{background:var(--ok-bg)} .fb.mid{background:var(--mid-bg)} .fb.bad{background:var(--err-bg)}
.fb .react{font-weight:700;font-size:18px;margin:0 0 8px}
.fb .pts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fb .pts span{font-size:14px;font-weight:700;color:#fff;border-radius:12px;padding:2px 10px}
.fb p{margin:4px 0}
.small{font-size:15px;color:var(--muted)}
.warn{color:var(--err);font-size:15px}
.row{display:grid;grid-template-columns:1fr minmax(200px,260px);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ok-f{border-color:var(--ok)!important} .ko-f{border-color:var(--err)!important}
table.std{border-collapse:collapse;width:100%;font-size:16px;margin:6px 0 14px}
table.std th,table.std td{border:1px solid var(--line);padding:6px 10px;text-align:left}
table.std th{background:var(--navy);color:var(--navy-ink)}
.tablewrap{overflow-x:auto}

.fiche{border:1px solid var(--line);border-radius:6px;padding:18px 20px;background:var(--card);max-width:720px}
.fiche .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--orange);padding-bottom:8px;margin-bottom:12px}
.fiche .head .logo{font-size:22px}
.fiche .head small.addr{font-size:12px;color:var(--muted);text-align:right;font-style:italic}
.fiche h3{text-align:center;color:var(--navy);text-decoration:underline;margin:6px 0 12px}
.fiche h4{text-align:center;color:var(--orange);text-decoration:underline;margin:14px 0 8px;font-family:"Bricolage Grotesque",sans-serif}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fiche h3{color:#9DB9E6} }
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;align-items:start}
.fld{display:grid;gap:3px} .fld label{font-weight:700;font-size:15px}
.nat label{display:flex;gap:8px;align-items:center;font-size:16px;padding:2px 0}
.nat input{width:18px;height:18px}
.badge{display:inline-block;background:var(--orange);color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;padding:8px 18px;border-radius:8px;transform:rotate(-2deg)}
table.rec{width:100%;border-collapse:collapse;margin-top:8px}
table.rec td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.2)}
table.rec td:last-child{text-align:right;font-weight:700}
.check label{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:4px;flex:none}
footer{max-width:980px;margin:0 auto;padding:0 18px 36px;font-size:15px;color:var(--muted)}
footer a{color:inherit;font-weight:700}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:15px}
[hidden]{display:none!important}
@media (max-width:820px){.layout{grid-template-columns:1fr}.caller{position:static}.cols,.fgrid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.ringing .phone{animation:none}.g .fi,.mood div{transition:none}}
</style>
</head>
<body>
<main>
  <div class="bar"><div class="logo">NOVELYS<small>Solutions &amp; événements d'entreprise</small></div><span class="tag">L'appel téléphonique · Niveau 1</span></div>
  <div class="gauges" id="gauges" hidden>
    <div class="g"><b><span style="color:var(--mots)">Les mots</span><span id="pm">–</span></b><div class="tr"><div class="fi" id="fm" style="background:var(--mots)"></div></div></div>
    <div class="g"><b><span style="color:var(--voix)">La voix</span><span id="pv">–</span></b><div class="tr"><div class="fi" id="fv" style="background:var(--voix)"></div></div></div>
    <div class="g"><b><span style="color:var(--meth)">La méthode</span><span id="pt">–</span></b><div class="tr"><div class="fi" id="ft" style="background:var(--meth)"></div></div></div>
  </div>
  <div id="app"></div>
</main>
<footer>Un autre élève doit commencer ? <button class="linkbtn" id="reset">Tout effacer</button> · <a href="index.html#novelys">← Retour à tous les jeux</a></footer>

<script>
const KEY="novelys-tel-niveau1";
const STANDARD=[["10","Direction générale","Isabelle Vandermeulen"],["11","Secrétariat & Accueil","Nathalie Fontaine (et toi)"],["20","Commercial & Événementiel",""],["30","Comptabilité & Achats",""],["40","Ressources humaines",""]];
const stdTable=()=>`<div class="tablewrap"><table class="std"><tr><th>Poste</th><th>Service</th><th>Responsable</th></tr>${STANDARD.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table></div>`;

/* ---------- Déroulé ----------
   Étapes d'un appel :
   ring  : décrocher avant la 3e sonnerie (points « méthode », max 3)
   duo   : say [texte, points mots 0-4, explication] + voice [texte, points voix 0-3, explication]
   one   : une seule question {cat:"m"|"v"|"t", opts:[texte, points 0-3, explication]}
   poste : choisir le bon poste du standard (méthode, max 3)
   fiche : remplir la fiche message NOVELYS (méthode, max 8)                          */
const SEQ=[
{kind:"call", who:"M. Renard", org:"Imprimix (fournisseur)", num:"071 48 22 90", t:"09:05", mood:55, steps:[
  {type:"ring"},
  {type:"duo", ctx:"Tu décroches.", q:"",
   say:[["« NOVELYS bonjour, [ton prénom] à l'appareil. En quoi puis-je vous aider ? »",4,"Entreprise, puis prénom, puis une question ouverte : la présentation parfaite."],
        ["« Allô ? »",0,"« Allô ? » ne dit ni qui répond, ni où l'on appelle. À éviter absolument."],
        ["« [ton prénom], de NOVELYS, bonjour. »",2,"Presque : on dit d'abord l'entreprise, puis le prénom, jamais l'inverse."]],
   voice:[["Je souris avant de décrocher, je me tiens droit(e), ton posé.",3,"Le sourire s'entend, même sans être vu. Et la posture droite se ressent dans la voix."],
          ["Je réponds en continuant à taper mon e-mail.",0,"L'appelant l'entend : ton distrait, phrases hachées."],
          ["Je parle très vite pour gagner du temps.",1,"Un débit trop rapide rend la présentation difficile à comprendre."]]},
  {type:"duo", ctx:"L'appelant répond, un peu sèchement :", q:"« Oui, bonjour. C'est pour une facture qui n'est toujours pas payée. »",
   say:[["« Je vais vous orienter vers le bon service. Puis-je savoir qui est à l'appareil, et pour quelle société ? »",4,"Tu identifies l'appelant (nom et société) poliment, en expliquant pourquoi tu le demandes."],
        ["« C'est qui ? »",0,"Beaucoup trop abrupt : on identifie sans interroger brutalement."],
        ["« Ah, les factures, c'est pas ici. »",1,"Tu ne sais pas encore qui appelle, et la formule est négative."]],
   voice:[["Ton calme et aimable, malgré sa sécheresse.",3,"Tu ne réponds pas sur le même registre."],
          ["Je soupire avant de répondre.",0,"Un soupir s'entend très nettement au téléphone."],
          ["Voix monotone.",1,"Au téléphone, la voix porte toute l'impression : la monotonie paraît désintéressée."]]},
  {type:"poste", ctx:"« Renard, de la société Imprimix. Nous sommes votre fournisseur de brochures. »", q:"Vers quel poste dois-tu transférer cet appel ?", a:"30",
   why:"Une facture fournisseur concerne la Comptabilité & Achats, au poste 30."},
  {type:"one", cat:"t", q:"Comment transfères-tu l'appel ?",
   opts:[["« Je vous mets en relation avec le service comptabilité, ne quittez pas. » Puis je préviens la collègue du motif : facture Imprimix impayée.",3,"L'appelant sait ce qui se passe, et la collègue n'aura pas à tout redemander."],
         ["« Je vous mets en relation avec la comptabilité, ne quittez pas. » Et je transfère directement, sans rien dire à la collègue.",1,"La formule est bonne, mais la collègue ne connaît pas le motif : l'appelant devra tout répéter."],
         ["« Je vous passe la compta. »",0,"« Je vous passe » est à éviter, et rien n'est expliqué."],
         ["« Rappelez le poste 30, c'est plus simple. »",0,"C'est à toi de transférer l'appel, pas à l'appelant de rappeler."]]},
  {type:"one", cat:"t", q:"Le poste 30 est occupé : personne ne décroche. Que fais-tu ?",
   opts:[["Je reviens vers M. Renard : « Je ne parviens pas à joindre la comptabilité pour l'instant. Souhaitez-vous que je prenne un message, ou préférez-vous rappeler dans quelques minutes ? »",3,"On ne laisse jamais l'appelant sans nouvelles : tu reviens vers lui et tu proposes une alternative."],
         ["Je le laisse en attente : ils finiront bien par décrocher.",0,"Une attente sans nouvelles donne l'impression d'être oublié."],
         ["Je raccroche discrètement.",0,"C'est le pire scénario : l'appelant se croit abandonné."]]}],
  end:["M. Renard préfère laisser un message : « Merci, c'est très aimable. »","M. Renard raccroche, agacé."]},
{kind:"train", cat:"m", title:"À privilégier ou à éviter ?",
 intro:"Au téléphone, chaque mot compte. Indique pour chaque phrase si elle est à privilégier ou à éviter.",
 opts:["À privilégier","À éviter"],
 rows:[["« Allô ? »",1],["« NOVELYS bonjour, Sarah à l'appareil. »",0],["« Je vous passe la compta. »",1],["« Un instant, je vérifie cela pour vous. »",0],["« Restez en ligne. » (sans demander son accord)",1],["« Je vous prie de m'excuser pour cette attente. »",0]],
 fb:"On privilégie les formules complètes et courtoises : « Je vous mets en relation avec… », « Puis-je vous demander de patienter quelques instants ? »."},
{kind:"call", who:"M. Kowalczyk", org:"Brico-Pro", num:"0478 63 20 15", t:"10:40", mood:60, steps:[
  {type:"ring"},
  {type:"duo", ctx:"Tu décroches et tu te présentes. L'appelant parle très vite :", q:"« Oui bonjour, Kowalczyk, de Brico-Pro, je voudrais parler à Madame Fontaine, c'est pour notre commande de cloisons. »",
   say:[["« Pourriez-vous épeler votre nom, s'il vous plaît ? »",4,"On ne devine jamais l'orthographe d'un nom mal compris. Il épelle : K, O, W, A, L, C, Z, Y, K."],
        ["« D'accord, Monsieur Kovalchik. »",0,"Tu as deviné, et c'est faux. Le message sera mal transmis."],
        ["« Pardon ? Pardon ? Pardon ? »",1,"Faire répéter sans méthode agace l'appelant. Demande-lui plutôt d'épeler."]],
   voice:[["Ton aimable, je note au fur et à mesure.",3,"Tu as de quoi noter à portée de main : c'est un réflexe de base."],
          ["Je retiens tout dans ma tête.",1,"La mémoire ne suffit pas : on note immédiatement."],
          ["Voix agacée : il parle trop vite !",0,"L'agacement s'entend. Reste calme et posé(e)."]]},
  {type:"duo", ctx:"Mme Fontaine est en rendez-vous à l'extérieur jusqu'à 14 h. Que dis-tu à M. Kowalczyk ?", q:"",
   say:[["« Madame Fontaine n'est pas disponible pour le moment. Puis-je prendre un message ? »",4,"Général et honnête : on ne donne pas le détail de l'absence d'un collègue."],
        ["« Elle est chez le dentiste, elle revient à 14 h. »",0,"Confidentialité : on ne précise jamais la raison de l'absence d'un collègue."],
        ["« Elle est pas là. »",1,"Trop familier, et tu ne proposes rien."]],
   voice:[["Voix souriante et posée.",3,"Le sourire rend l'annonce d'une indisponibilité plus agréable."],
          ["Voix désolée, presque gênée.",1,"Pas besoin de t'excuser : l'absence d'un collègue est normale. Propose une solution."],
          ["Je mâche un chewing-gum.",0,"Manger, boire ou mâcher pendant un appel est à éviter : tout s'entend."]]},
  {type:"one", cat:"t", ctx:"Il donne son numéro, très rapidement :", q:"« Zéro quatre sept huit, soixante-trois, vingt, quinze. » Que fais-tu ?",
   opts:[["Je le répète par petits groupes : « 0478 / 63 / 20 / 15, c'est bien cela ? »",3,"Répéter un numéro par petits groupes permet de vérifier qu'il est bien noté."],
         ["Je lui demande de le répéter une seule fois, en entier.",1,"Mieux que rien, mais c'est à toi de le répéter pour le vérifier."],
         ["« C'est noté ! », sans le répéter.",0,"Une seule erreur de chiffre, et le message devient inutile."]]},
  {type:"duo", ctx:"Il ajoute :", q:"« Ce n'est pas urgent, mais j'aimerais qu'elle me rappelle aujourd'hui, avant 17 h. »",
   say:[["« Je récapitule : Madame Fontaine vous rappelle aujourd'hui avant 17 h, au 0478 63 20 15, au sujet de votre commande de cloisons. Merci de votre appel, bonne journée. »",4,"Récapituler, remercier, saluer : c'est la conclusion parfaite."],
        ["« OK, je lui dirai. Au revoir. »",1,"Rien n'est récapitulé : impossible de vérifier que le message est complet."],
        ["« Ça marche, salut ! »",0,"Beaucoup trop familier pour un appel professionnel."]],
   voice:[["Ton chaleureux, et je le laisse raccrocher le premier.",3,"Laisser l'appelant raccrocher le premier est une marque de politesse."],
          ["Je raccroche dès que j'ai fini ma phrase.",0,"Il avait peut-être encore quelque chose à dire."],
          ["Ton pressé : un autre appel arrive.",1,"L'appelant sent qu'on le « bâcle »."]]},
  {type:"fiche"}],
  end:["M. Kowalczyk : « Parfait, merci beaucoup ! »","M. Kowalczyk raccroche, pas vraiment rassuré."]},
{kind:"train", cat:"t", title:"Le bon poste",
 intro:"Consulte le standard NOVELYS : vers quel poste dois-tu transférer chacune de ces demandes ?", std:true,
 opts:["Poste 10","Poste 11","Poste 20","Poste 30","Poste 40"],
 rows:[["Un client veut organiser un séminaire pour 50 personnes.",2],["Une candidate demande où envoyer son CV.",3+1],["Un fournisseur demande quand sa facture sera payée.",3],["Une journaliste souhaite interviewer la directrice générale.",0]],
 fb:"10 : direction générale. 11 : secrétariat et accueil. 20 : commercial et événementiel. 30 : comptabilité et achats. 40 : ressources humaines."},
{kind:"call", who:"Mme Delhaye", org:"Cliente, société Arcanes", num:"065 39 71 08", t:"11:50", mood:25, steps:[
  {type:"ring"},
  {type:"duo", ctx:"À peine as-tu dit « NOVELYS bonjour » qu'elle hausse le ton :", q:"« Ça fait trois jours que j'attends le mobilier pour mon événement ! Si ce n'est pas réglé aujourd'hui, j'annule tout ! »",
   say:[["« Si je comprends bien, votre livraison a trois jours de retard, et c'est très gênant pour votre événement. Je comprends votre inquiétude. »",4,"Tu reformules et tu montres que tu comprends : c'est le premier pas pour désamorcer."],
        ["« Calmez-vous, Madame. »",0,"« Calmez-vous » produit presque toujours l'effet inverse."],
        ["« Ce n'est pas moi qui m'occupe des livraisons. »",0,"On ne se justifie jamais au nom de l'entreprise : on reste du côté de la solution."]],
   voice:[["Ton particulièrement calme et posé.",3,"Au téléphone, le ton doit tout compenser : toute tension dans la voix s'entend."],
          ["Je hausse le ton pour me faire entendre.",0,"Répondre sur le même registre fait monter la tension."],

    <div class="three"><div style="background:var(--mots)"><strong>Les mots : ${m} %</strong></div><div style="background:var(--voix)"><strong>La voix : ${v} %</strong></div><div style="background:var(--meth)"><strong>La méthode : ${t} %</strong></div></div>
    <p>Ton point à travailler en priorité : <b>${weak}</b>.</p>
    <table class="rec">${S.recap.map(([w,md])=>`<tr><td>${esc(w)} a raccroché…</td><td>${moodLabel(md)[0]}</td></tr>`).join("")}</table>
    <div class="actions"><button class="btn ghost" id="again" style="color:#fff;border-color:rgba(255,255,255,.4)">Recommencer</button></div></section>
    ${all>=70?`<section class="card" style="margin-top:18px;border-left:6px solid var(--ok)"><h2 style="font-size:28px">Mission finale : ton propre appel (dans Word)</h2>
      <p><b>La situation :</b> Mme Jacobs, de la société Fleurs &amp; Co, appelle pour parler à Mme Vandermeulen, qui n'est pas disponible avant 15 h. Elle rappellera elle-même vers 15 h 30. Son numéro : 0496 15 42 87.</p>
      <div class="check">${["Écris le script complet de l'appel, réplique par réplique","Les 5 étapes y sont : décrocher, se présenter, identifier, traiter, conclure","Tu demandes d'épeler le nom et tu répètes le numéro par petits groupes","Tu ne donnes pas la raison de l'absence de Mme Vandermeulen","Tu récapitules avant de saluer","En dessous, recrée la fiche message NOVELYS (tableau) et remplis tous ses champs","Relu : zéro faute"].map(x=>`<label><input type="checkbox"> ${x}</label>`).join("")}</div>
      <p><b>Quand tout est coché, lève la main et montre ton document au professeur.</b></p></section>`
    :`<section class="card" style="margin-top:18px"><h2 style="font-size:26px">Mission finale verrouillée</h2><p>Atteins au moins 70 % pour la débloquer. Relis ton mémo NOVELYS et recommence !</p></section>`}`;
  $("#again").onclick=()=>{ S={phase:"play",k:0,s:0,sc:{m:[0,0],v:[0,0],t:[0,0]},moods:{},recap:[]}; save(); render(); };
}
function render(){
  stopTimer();
  if(S.phase==="play" && S.k>=SEQ.length) S.phase="end";
  save(); gauges();
  if(S.phase==="start") start(); else if(S.phase==="end") end();
  else { SEQ[S.k].kind==="call" ? callStep() : train(); }
  window.scrollTo(0,0);
}
$("#reset").onclick=()=>{ if(!confirm("Effacer la partie en cours ?")) return; S={phase:"start",k:0,s:0,sc:{m:[0,0],v:[0,0],t:[0,0]},moods:{},recap:[]}; save(); render(); };
if(S.phase==="play"){ gauges(); $("#gauges").hidden=true; start(); } else render();
</script>
</body>
</html>
