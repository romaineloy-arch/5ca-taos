<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Au bout du fil — Novelys, l'appel téléphonique, niveau 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --card:#FFFFFF; --ink:#1A2740; --muted:#56627A; --line:#CBD3E0;
  --navy:#1F3A63; --navy-ink:#FFFFFF; --orange:#E07B2E; --orange-soft:#FCEBDD;
  --mots:#2F6FB0; --voix:#8A5CC2; --meth:#1F8A70;
  --ok:#237A4B; --ok-bg:#E3F3E8; --mid:#8A6100; --mid-bg:#FFF1CF; --err:#B3261E; --err-bg:#FBE6E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#10182A; --card:#1A2439; --ink:#E6EBF4; --muted:#9FAAC0; --line:#33415C; --navy:#2A4C80; --orange-soft:#3F2A18; --mots:#7FB2E6; --voix:#C0A0EA; --meth:#5CC9A7; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
}
:root[data-theme="dark"]{ --bg:#10182A; --card:#1A2439; --ink:#E6EBF4; --muted:#9FAAC0; --line:#33415C; --navy:#2A4C80; --orange-soft:#3F2A18; --mots:#7FB2E6; --voix:#C0A0EA; --meth:#5CC9A7; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.12;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input[type=text],select{padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);max-width:100%;width:100%}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:18px 18px 40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;color:var(--navy)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo{color:#9DB9E6} }
.logo::before{content:"";display:inline-block;width:10px;height:10px;background:var(--orange);margin-right:6px;vertical-align:4px}
.logo small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:12px;color:var(--orange);letter-spacing:.08em;text-transform:uppercase}
.tag{background:var(--navy);color:var(--navy-ink);font-size:14px;font-weight:700;padding:4px 12px;border-radius:20px}
.gauges{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.g{flex:1;min-width:150px}
.g b{font-size:13px;display:flex;justify-content:space-between}
.g .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.g .fi{height:100%;width:0;transition:width .5s}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.hero{background:var(--navy);color:var(--navy-ink);border:0}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:800}
.hero h1 span{color:var(--orange)}
.hero p{max-width:64ch}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.three div{border-radius:8px;padding:12px 14px;color:#fff}
.three strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:21px}
.three p{margin:4px 0 0;font-size:15.5px}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.caller{position:sticky;top:12px;border-radius:12px;padding:18px;background:var(--navy);color:var(--navy-ink)}
.caller .lbl{font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.08em}
.caller .who{font-family:"Bricolage Grotesque",sans-serif;font-size:23px;font-weight:800;line-height:1.1;margin:4px 0}
.caller .num{font-family:"JetBrains Mono",monospace;color:#F5B27A}
.caller .clock{font-family:"JetBrains Mono",monospace;font-size:26px;color:var(--orange);margin-bottom:10px}
.mood{height:10px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden;margin:12px 0 4px}
.mood div{height:100%;transition:width .6s,background .6s}
.step-n{font-size:14px;opacity:.8;margin-top:10px}

.ringer{text-align:center;padding:28px 10px}
.phone{font-size:62px;display:inline-block}
.ringing .phone{animation:shake .45s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.rings{display:flex;gap:8px;justify-content:center;margin:12px 0 18px}
.rings span{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.rings span.on{background:var(--orange);border-color:var(--orange)}
.rings span.limit{outline:2px dashed var(--err);outline-offset:3px}
.big{font-size:22px;padding:16px 34px;border-radius:40px}

.said{border-left:5px solid var(--orange);background:var(--bg);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:16px}
.said p{margin:0 0 6px}
.said .quote{font-size:20px;font-weight:700}
.said .ctx{font-style:italic;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col h3{font-size:19px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col h3 i{font-style:normal;font-size:12px;font-family:"Atkinson Hyperlegible",sans-serif;color:#fff;padding:2px 8px;border-radius:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:9px;cursor:pointer;background:var(--card);font-size:16.5px}
.opt:hover{border-color:var(--orange)}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt.best{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--err)}
.btn{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:12px 22px;font-weight:700;font-size:18px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.fb{border-radius:8px;padding:14px 16px;margin-top:14px}
.fb.good{background:var(--ok-bg)} .fb.mid{background:var(--mid-bg)} .fb.bad{background:var(--err-bg)}
.fb .react{font-weight:700;font-size:18px;margin:0 0 8px}
.fb .pts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.fb .pts span{font-size:14px;font-weight:700;color:#fff;border-radius:12px;padding:2px 10px}
.fb p{margin:4px 0}
.small{font-size:15px;color:var(--muted)}
.warn{color:var(--err);font-size:15px}
.row{display:grid;grid-template-columns:1fr minmax(200px,260px);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ok-f{border-color:var(--ok)!important} .ko-f{border-color:var(--err)!important}
table.std{border-collapse:collapse;width:100%;font-size:16px;margin:6px 0 14px}
table.std th,table.std td{border:1px solid var(--line);padding:6px 10px;text-align:left}
table.std th{background:var(--navy);color:var(--navy-ink)}
.tablewrap{overflow-x:auto}

.fiche{border:1px solid var(--line);border-radius:6px;padding:18px 20px;background:var(--card);max-width:720px}
.fiche .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--orange);padding-bottom:8px;margin-bottom:12px}
.fiche .head .logo{font-size:22px}
.fiche .head small.addr{font-size:12px;color:var(--muted);text-align:right;font-style:italic}
.fiche h3{text-align:center;color:var(--navy);text-decoration:underline;margin:6px 0 12px}
.fiche h4{text-align:center;color:var(--orange);text-decoration:underline;margin:14px 0 8px;font-family:"Bricolage Grotesque",sans-serif}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fiche h3{color:#9DB9E6} }
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;align-items:start}
.fld{display:grid;gap:3px} .fld label{font-weight:700;font-size:15px}
.nat label{display:flex;gap:8px;align-items:center;font-size:16px;padding:2px 0}
.nat input{width:18px;height:18px}
.badge{display:inline-block;background:var(--orange);color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;padding:8px 18px;border-radius:8px;transform:rotate(-2deg)}
table.rec{width:100%;border-collapse:collapse;margin-top:8px}
table.rec td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.2)}
table.rec td:last-child{text-align:right;font-weight:700}
.check label{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:4px;flex:none}
footer{max-width:980px;margin:0 auto;padding:0 18px 36px;font-size:15px;color:var(--muted)}
footer a{color:inherit;font-weight:700}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:15px}
[hidden]{display:none!important}
@media (max-width:820px){.layout{grid-template-columns:1fr}.caller{position:static}.cols,.fgrid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.ringing .phone{animation:none}.g .fi,.mood div{transition:none}}
</style>
</head>
<body>
<main>
  <div class="bar"><div class="logo">NOVELYS<small>Solutions &amp; événements d'entreprise</small></div><span class="tag">L'appel téléphonique · Niveau 1</span></div>
  <div class="gauges" id="gauges" hidden>
    <div class="g"><b><span style="color:var(--mots)">Les mots</span><span id="pm">–</span></b><div class="tr"><div class="fi" id="fm" style="background:var(--mots)"></div></div></div>
    <div class="g"><b><span style="color:var(--voix)">La voix</span><span id="pv">–</span></b><div class="tr"><div class="fi" id="fv" style="background:var(--voix)"></div></div></div>
    <div class="g"><b><span style="color:var(--meth)">La méthode</span><span id="pt">–</span></b><div class="tr"><div class="fi" id="ft" style="background:var(--meth)"></div></div></div>
  </div>
  <div id="app"></div>
</main>
<footer>Un autre élève doit commencer ? <button class="linkbtn" id="reset">Tout effacer</button> · <a href="index.html#novelys">← Retour à tous les jeux</a></footer>
