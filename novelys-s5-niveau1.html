<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face à face — l'accueil au comptoir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EFEE; --card:#FFFFFF; --ink:#1B2B2A; --muted:#566B69; --line:#C6D6D4;
  --accent:#E0654F; --accent-ink:#FFFFFF;
  --verbal:#2F6FB0; --vocal:#8A5CC2; --visuel:#1F8A70;
  --ok:#237A4B; --ok-bg:#E3F3E8; --mid:#8A6100; --mid-bg:#FFF1CF; --err:#B3261E; --err-bg:#FBE6E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#122120; --card:#1C2E2C; --ink:#E4EFED; --muted:#9DB5B2; --line:#34504D; --verbal:#7FB2E6; --vocal:#C0A0EA; --visuel:#5CC9A7; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
}
:root[data-theme="dark"]{ --bg:#122120; --card:#1C2E2C; --ink:#E4EFED; --muted:#9DB5B2; --line:#34504D; --verbal:#7FB2E6; --vocal:#C0A0EA; --visuel:#5CC9A7; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
select{font:inherit;color:inherit;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:26px 18px 40px}

.top{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px}
.brand span{color:var(--accent)}
.ntag{order:3;background:var(--ink);color:var(--bg);font-size:14px;font-weight:700;padding:4px 12px;border-radius:20px}
.vvv{display:flex;gap:14px;flex-wrap:wrap}
.g{min-width:130px}
.g b{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.g .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.g .fi{height:100%;width:0;transition:width .5s}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800}
.hero h1 span{color:var(--accent)}
.hero p{max-width:62ch}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:20px 0}
.three div{border-radius:8px;padding:14px 16px;color:#fff}
.three strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:22px}
.three p{margin:4px 0 0;font-size:16px}

.scene{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.client{position:sticky;top:12px;border-radius:10px;padding:18px;background:var(--ink);color:var(--bg)}
.client .who{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;font-weight:800;line-height:1.1}
.client .role{font-size:15px;opacity:.8;margin-bottom:14px}
.mood-l{font-size:13px;opacity:.85}
.mood{height:12px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin:4px 0 4px}
.mood div{height:100%;transition:width .6s,background .6s}
.mood-t{font-weight:700;font-size:16px}
.turn-n{font-size:14px;opacity:.8;margin-top:12px}

.sit{border-left:5px solid var(--accent);background:var(--bg);padding:14px 16px;border-radius:0 8px 8px 0;margin-bottom:18px}
.sit p{margin:0 0 6px}
.sit .say{font-size:20px;font-weight:700}
.sit .body{font-style:italic;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col h3{font-size:19px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.col h3 i{font-style:normal;font-size:12px;font-family:"Atkinson Hyperlegible",sans-serif;color:#fff;padding:2px 8px;border-radius:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;cursor:pointer;background:var(--card);font-size:16.5px}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt.best{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--err)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px 22px;font-weight:700;font-size:18px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.fb{border-radius:8px;padding:14px 16px;margin-top:16px}
.fb.good{background:var(--ok-bg)} .fb.mid{background:var(--mid-bg)} .fb.bad{background:var(--err-bg)}
.fb .react{font-weight:700;font-size:18px;margin:0 0 8px}
.fb .pts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.fb .pts span{font-size:14px;font-weight:700;color:#fff;border-radius:12px;padding:2px 10px}
.fb p{margin:4px 0}
.dec .row{display:grid;grid-template-columns:1fr minmax(200px,280px);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.small{font-size:15px;color:var(--muted)}
.badge{display:inline-block;background:var(--accent);color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:26px;padding:8px 18px;border-radius:8px;transform:rotate(-2deg)}
table.rec{width:100%;border-collapse:collapse;font-size:16px;margin-top:10px}
table.rec td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.rec td:last-child{text-align:right;font-weight:700}
.check label{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:4px;flex:none}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:15px}
footer{max-width:980px;margin:0 auto;padding:0 18px 36px;font-size:15px;color:var(--muted);display:flex;gap:20px;flex-wrap:wrap}
footer a{color:inherit;font-weight:700}
[hidden]{display:none!important}
@media (max-width:760px){.scene{grid-template-columns:1fr}.client{position:static}.cols{grid-template-columns:1fr}.dec .row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.g .fi,.mood div{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">Face à <span>face</span></div>
    <span class="ntag">L'accueil en face à face · Niveau 1</span>
    <div class="vvv" id="vvv" hidden>
      <div class="g"><b><span style="color:var(--verbal)">Les mots</span><span id="pv">–</span></b><div class="tr"><div class="fi" id="fv" style="background:var(--verbal)"></div></div></div>
      <div class="g"><b><span style="color:var(--vocal)">La voix</span><span id="pc">–</span></b><div class="tr"><div class="fi" id="fc" style="background:var(--vocal)"></div></div></div>
      <div class="g"><b><span style="color:var(--visuel)">Le corps</span><span id="pb">–</span></b><div class="tr"><div class="fi" id="fb" style="background:var(--visuel)"></div></div></div>
    </div>
  </div>
  <div id="app"></div>
</main>
