<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mercredi : l'accueil sous pression — Semaine intégrative 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --card:#FFFFFF; --ink:#1A2740; --muted:#56627A; --line:#CBD3E0;
  --navy:#1F3A63; --navy-ink:#FFFFFF; --orange:#E07B2E; --orange-soft:#FCEBDD;
  --ok:#237A4B; --ok-bg:#E3F3E8; --mid:#8A6100; --mid-bg:#FFF1CF; --err:#B3261E; --err-bg:#FBE6E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#10182A; --card:#1A2439; --ink:#E6EBF4; --muted:#9FAAC0; --line:#33415C; --navy:#2A4C80; --orange-soft:#3F2A18; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
}
:root[data-theme="dark"]{ --bg:#10182A; --card:#1A2439; --ink:#E6EBF4; --muted:#9FAAC0; --line:#33415C; --navy:#2A4C80; --orange-soft:#3F2A18; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.12;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input[type=text],select{padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);max-width:100%;width:100%}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;color:var(--navy)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo{color:#9DB9E6} }
.logo::before{content:"";display:inline-block;width:10px;height:10px;background:var(--orange);margin-right:6px;vertical-align:4px}
.logo small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:12px;color:var(--orange);letter-spacing:.08em;text-transform:uppercase}
.tag{background:var(--navy);color:var(--navy-ink);font-size:14px;font-weight:700;padding:4px 12px;border-radius:20px}
.clock{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:28px;color:var(--orange)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.hero{background:var(--navy);color:var(--navy-ink);border:0}
.hero h1{font-size:clamp(30px,5vw,48px);font-weight:800}
.hero h1 span{color:var(--orange)}
.hero p{max-width:66ch}
.rules{margin:12px 0 0;padding-left:22px} .rules li{margin-bottom:6px}

.side{position:sticky;top:12px}
.tabs{display:flex;gap:6px;margin-bottom:-1px}
.tabs button{flex:1;border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:8px 8px 0 0;padding:8px 6px;font-weight:700;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--orange)}
.panel{border-radius:0 0 10px 10px;padding:16px;min-height:200px;font-size:16px}
.panel h3{font-size:18px;margin-bottom:8px}
.vis{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.vis b{display:block}
.vis small{color:var(--muted)}
.sat{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.sat div{height:100%;transition:width .5s}
.ag{border-left:4px solid var(--navy);padding:6px 10px;margin-bottom:8px;background:var(--bg);border-radius:0 6px 6px 0}
.ag .h{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--orange)}
.note{background:var(--orange-soft);border-radius:6px;padding:8px 10px;margin-top:8px}
.note.new{outline:2px solid var(--orange)}
table.reg{width:100%;border-collapse:collapse;font-size:14px}
table.reg th,table.reg td{border:1px solid var(--line);padding:4px 6px;text-align:left}
.empty{color:var(--muted);font-style:italic}

.sit{border-left:5px solid var(--orange);background:var(--bg);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:16px}
.sit p{margin:0 0 6px}
.msg{background:var(--navy);color:var(--navy-ink);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:16px}
.task{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.task .q{font-weight:700;margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--orange)}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt.best{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--err)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:4px} .fld label{font-weight:700;font-size:15px}
.ok-f{border-color:var(--ok)!important} .ko-f{border-color:var(--err)!important}
.desc .fld{grid-template-columns:44px 1fr;align-items:center}
.desc .fld label{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;color:var(--orange)}
.btn{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-weight:700;font-size:17px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.hero .btn.ghost{color:var(--navy-ink);border-color:rgba(255,255,255,.4)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.fb{border-radius:8px;padding:12px 14px;margin-top:12px;font-size:16.5px}
.fb.good{background:var(--ok-bg)} .fb.mid{background:var(--mid-bg)} .fb.bad{background:var(--err-bg)}
.fb strong{display:block;margin-bottom:4px}
.warn{color:var(--err);font-size:15px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.cats div{border-radius:8px;padding:12px 14px;background:rgba(255,255,255,.12)}
.cats strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:26px}
table.rec{width:100%;border-collapse:collapse;margin-top:8px}
table.rec td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.2)}
table.rec td:last-child{text-align:right;font-weight:700}
.check label{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:4px;flex:none}
footer{max-width:1180px;margin:0 auto;padding:0 18px 36px;font-size:15px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:15px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.grid2{grid-template-columns:1fr}}

.ringer{text-align:center;padding:14px 10px 4px}
.phone{font-size:54px;display:inline-block}
.ringing .phone{animation:shake .45s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.rings{display:flex;gap:8px;justify-content:center;margin:10px 0 14px}
.rings span{width:16px;height:16px;border-radius:50%;border:2px solid var(--line)}
.rings span.on{background:var(--orange);border-color:var(--orange)}
.rings span.limit{outline:2px dashed var(--err);outline-offset:3px}
.big{font-size:21px;padding:14px 32px;border-radius:40px}
table.std{border-collapse:collapse;width:100%;font-size:14px}
table.std th,table.std td{border:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.std th{background:var(--navy);color:var(--navy-ink)}
.dispo{font-weight:700} .dispo.ok{color:var(--ok)} .dispo.no{color:var(--err)}
.fiche{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:var(--card)}
.fiche .fh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--orange);padding-bottom:6px;margin-bottom:10px}
.fiche .fh .logo{font-size:20px}
.fiche .fh small{font-size:12px;color:var(--muted);font-style:italic;text-align:right}
.fiche h3{text-align:center;text-decoration:underline;margin:4px 0 10px;color:var(--navy)}
.fiche h4{text-align:center;color:var(--orange);text-decoration:underline;margin:12px 0 8px;font-family:"Bricolage Grotesque",sans-serif}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fiche h3{color:#9DB9E6} }
.fiche .grid2{align-items:start}
.nat label{display:flex;gap:8px;align-items:center;font-size:16px;padding:2px 0;font-weight:400}
.nat input,.msgopt input{width:18px;height:18px}
.fmini{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:14px}
@media (prefers-reduced-motion:reduce){.ringing .phone{animation:none}}
[hidden]{display:none!important}

.mailin{border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:14px}
.mailin .mh{background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px;border-radius:8px 8px 0 0}
.mailin .mh b{display:inline-block;min-width:56px}
.mailin .mb{padding:12px 14px;white-space:pre-line}
.composer{border:2px solid var(--navy);border-radius:8px;overflow:hidden}
.composer .ch{background:var(--navy);color:#fff;padding:8px 12px;font-weight:700;font-size:15px}
.composer .cf{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.composer .cf label{font-weight:700;font-size:15px;color:var(--muted)}
.composer input[type=text],.composer select,.composer textarea,.sigbox textarea{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit;font-size:16px}
.composer textarea{min-height:150px;resize:vertical}
.sigbox textarea{min-height:130px}
.composer .sigrow{padding:10px 12px;display:flex;gap:10px;align-items:center}
.composer .sigprev{white-space:pre-line;font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px;margin:0 12px 10px}
.crit{list-style:none;padding:0;margin:10px 0}
.crit li{padding:6px 10px;border-radius:6px;margin-bottom:5px;font-size:15.5px}
.crit li.ok{background:var(--ok-bg)} .crit li.ko{background:var(--err-bg)}
.model{background:var(--bg);border-left:4px solid var(--ok);padding:10px 14px;border-radius:0 8px 8px 0;white-space:pre-line;font-size:15px;margin-top:8px}
.decide{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.decide button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:12px 6px;font-weight:700;font-size:15px}
.decide button:hover{border-color:var(--orange)}
.decide button.right{border-color:var(--ok);background:var(--ok-bg)} .decide button.wrong{border-color:var(--err);background:var(--err-bg)}
.mi{border-bottom:1px solid var(--line);padding:6px 2px;font-size:14px}
.mi b{display:block}
.mi .st{font-size:12px;font-weight:700;color:var(--muted)}
.sent{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13.5px;white-space:pre-line}
.infot{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px}
.infot td,.infot th{border:1px solid var(--line);padding:4px 6px;text-align:left}
@media (max-width:760px){.composer .cf{grid-template-columns:1fr}.decide{grid-template-columns:1fr 1fr}}
[hidden]{display:none!important}
.regform{border:2px solid var(--navy);border-radius:8px;overflow:hidden}
.regform .rh{background:var(--navy);color:#fff;padding:8px 12px;font-weight:700;font-size:15px}
.regform .rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:12px}
.regform input,.regform select{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit;font-size:16px}
.ok-f{background:var(--ok-bg)!important} .ko-f{background:var(--err-bg)!important}
.corr{font-size:13px;color:var(--err);margin-top:2px;font-weight:700}
.fiche textarea{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit;font-size:16px}
.theory{border:2px solid var(--navy);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:16px}
.theory h3{font-size:18px;margin-bottom:6px;color:var(--orange)}
.theory table{width:100%;border-collapse:collapse;font-size:15px} .theory td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.rows{display:grid;gap:8px}
.rw{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,auto);gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.rw .rs{display:grid;gap:6px} .rw select{padding:7px 8px;border:2px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit;font-size:15px}
.good-sel{border-color:var(--ok)!important;background:var(--ok-bg)!important} .bad-sel{border-color:var(--err)!important;background:var(--err-bg)!important}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.eur{display:flex;align-items:center;gap:6px} .eur input{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit}
.mission{border:2px solid var(--orange);border-radius:10px;overflow:hidden}
.mission .mh{background:var(--orange);color:#fff;font-weight:800;padding:10px 14px;font-size:18px;display:flex;gap:10px;align-items:center}
.mission .mb{padding:14px 16px}
.app{background:#fff;border-radius:4px;padding:2px 8px;font-size:13px;font-weight:800}
.app.excel{color:#1D6F42} .app.word{color:#2B579A} .app.gmail{color:#C5221F}
.steps{margin:6px 0;padding-left:22px} .steps li{margin-bottom:6px}
.mdata{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:15px;overflow-x:auto}
.mdata table{border-collapse:collapse;width:100%;font-size:14px} .mdata td,.mdata th{border:1px solid var(--line);padding:4px 6px;text-align:left}
.codebox{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.lb{display:block;font-weight:700;font-size:15px;margin:10px 0 4px}
.startbox{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 16px;margin-top:16px;max-width:560px}
.startbox input{width:100%;padding:9px 10px;border-radius:6px;border:2px solid rgba(255,255,255,.35);background:#fff;color:#1A2740;font:inherit}
.hero .warn{color:#FFB4AB}
.bigcode{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:22px;letter-spacing:.04em;background:var(--bg);border:2px dashed var(--orange);border-radius:8px;padding:12px 14px;word-break:break-all;user-select:all}
.bonusbox{border:2px solid var(--mid);border-radius:10px;padding:12px 16px;margin-top:16px}
.bonusbox input{width:100%;max-width:320px;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit}
.codebox input{width:100%;max-width:340px;padding:9px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit;font-size:18px;letter-spacing:.05em}
.docx{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:6px 10px} .docx summary{cursor:pointer;font-weight:700}
.doc{background:#fff;color:#1A2740;border:1px solid #ccc;border-radius:4px;padding:10px;font-size:13px;margin-top:6px}
.doc table{width:100%;border-collapse:collapse;margin:6px 0} .doc td,.doc th{border:1px solid #bbb;padding:3px 5px;text-align:left} .doc .r{text-align:right}
.doc h4{margin:0 0 4px;font-size:15px}
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay .card{max-width:560px}
.repbtn{background:transparent;border:2px solid var(--line);border-radius:20px;padding:4px 12px;font-size:14px;font-weight:700}
.mot p{margin:0 0 8px} .mot ul{margin:0 0 8px;padding-left:20px}
@media (max-width:760px){.rw{grid-template-columns:1fr}}
.adr{display:grid;gap:8px;max-width:520px;border:1px solid #cfc8b8;background:var(--paper,#FBFAF6);border-radius:6px;padding:16px 18px;color:#1d1d1d}
.adr .stamp{justify-self:end;width:48px;height:56px;border:2px dashed #b04a3c;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#b04a3c}
.adr label{font-size:14px;font-weight:700;color:#5a5446}
.adr input{width:100%;padding:8px 10px;border:2px solid #cfc8b8;border-radius:6px;background:#fff;font:inherit;color:#1d1d1d;font-size:16px}
.desc .fld{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px} .desc .fld label{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;color:var(--orange)} .desc select{padding:8px;border:2px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit;font-size:15px;width:100%}
.live{position:sticky;top:0;z-index:5;background:var(--card);padding:8px 0 6px}
.ctrl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stage{background:var(--navy);color:var(--navy-ink);border-radius:10px;padding:18px 20px;min-height:140px}
.stage .who,.repbox .who{display:flex;gap:10px;align-items:center;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none}
.stage .txt{font-size:21px;margin-top:8px;line-height:1.45} .stage p.txt{font-size:19px}
.repbox{border:2px dashed var(--orange);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:16px;background:var(--orange-soft)}
.nbx{display:grid;gap:10px;margin-top:8px}
.nbox{scroll-margin-top:330px} .nbox label{font-weight:700;font-size:15px;display:block;margin-bottom:3px}
.nbox textarea{width:100%;min-height:74px;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:#FFFBEA;color:#1A2740;font-family:"Courier New",monospace;font-size:16px;resize:vertical}
.nbox.cur label{color:var(--orange)} .nbox.cur textarea{border-color:var(--orange)}

</style>
</head>
