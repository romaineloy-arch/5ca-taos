<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le hall en effervescence — Novelys, l'accueil en face à face, niveau 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --card:#FFFFFF; --ink:#1A2740; --muted:#56627A; --line:#CBD3E0;
  --navy:#1F3A63; --navy-ink:#FFFFFF; --orange:#E07B2E; --orange-soft:#FCEBDD;
  --ok:#237A4B; --ok-bg:#E3F3E8; --mid:#8A6100; --mid-bg:#FFF1CF; --err:#B3261E; --err-bg:#FBE6E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#10182A; --card:#1A2439; --ink:#E6EBF4; --muted:#9FAAC0; --line:#33415C; --navy:#2A4C80; --orange-soft:#3F2A18; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
}
:root[data-theme="dark"]{ --bg:#10182A; --card:#1A2439; --ink:#E6EBF4; --muted:#9FAAC0; --line:#33415C; --navy:#2A4C80; --orange-soft:#3F2A18; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.12;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input[type=text],select{padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);max-width:100%;width:100%}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;color:var(--navy)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo{color:#9DB9E6} }
.logo::before{content:"";display:inline-block;width:10px;height:10px;background:var(--orange);margin-right:6px;vertical-align:4px}
.logo small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:12px;color:var(--orange);letter-spacing:.08em;text-transform:uppercase}
.tag{background:var(--navy);color:var(--navy-ink);font-size:14px;font-weight:700;padding:4px 12px;border-radius:20px}
.clock{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:28px;color:var(--orange)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.hero{background:var(--navy);color:var(--navy-ink);border:0}
.hero h1{font-size:clamp(30px,5vw,48px);font-weight:800}
.hero h1 span{color:var(--orange)}
.hero p{max-width:66ch}
.rules{margin:12px 0 0;padding-left:22px} .rules li{margin-bottom:6px}

.side{position:sticky;top:12px}
.tabs{display:flex;gap:6px;margin-bottom:-1px}
.tabs button{flex:1;border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:8px 8px 0 0;padding:8px 6px;font-weight:700;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--orange)}
.panel{border-radius:0 0 10px 10px;padding:16px;min-height:200px;font-size:16px}
.panel h3{font-size:18px;margin-bottom:8px}
.vis{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.vis b{display:block}
.vis small{color:var(--muted)}
.sat{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.sat div{height:100%;transition:width .5s}
.ag{border-left:4px solid var(--navy);padding:6px 10px;margin-bottom:8px;background:var(--bg);border-radius:0 6px 6px 0}
.ag .h{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--orange)}
.note{background:var(--orange-soft);border-radius:6px;padding:8px 10px;margin-top:8px}
.note.new{outline:2px solid var(--orange)}
table.reg{width:100%;border-collapse:collapse;font-size:14px}
table.reg th,table.reg td{border:1px solid var(--line);padding:4px 6px;text-align:left}
.empty{color:var(--muted);font-style:italic}

.sit{border-left:5px solid var(--orange);background:var(--bg);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:16px}
.sit p{margin:0 0 6px}
.msg{background:var(--navy);color:var(--navy-ink);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:16px}
.task{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.task .q{font-weight:700;margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--orange)}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt.best{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--err)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:4px} .fld label{font-weight:700;font-size:15px}
.ok-f{border-color:var(--ok)!important} .ko-f{border-color:var(--err)!important}
.desc .fld{grid-template-columns:44px 1fr;align-items:center}
.desc .fld label{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;color:var(--orange)}
.btn{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-weight:700;font-size:17px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.hero .btn.ghost{color:var(--navy-ink);border-color:rgba(255,255,255,.4)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.fb{border-radius:8px;padding:12px 14px;margin-top:12px;font-size:16.5px}
.fb.good{background:var(--ok-bg)} .fb.mid{background:var(--mid-bg)} .fb.bad{background:var(--err-bg)}
.fb strong{display:block;margin-bottom:4px}
.warn{color:var(--err);font-size:15px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.cats div{border-radius:8px;padding:12px 14px;background:rgba(255,255,255,.12)}
.cats strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:26px}
table.rec{width:100%;border-collapse:collapse;margin-top:8px}
table.rec td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.2)}
table.rec td:last-child{text-align:right;font-weight:700}
.check label{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:4px;flex:none}
footer{max-width:1180px;margin:0 auto;padding:0 18px 36px;font-size:15px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:15px}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.grid2{grid-template-columns:1fr}}
</style>
</head>

<script>
const KEY="novelys-s5-niveau3";
const VIS={dubois:"M. Dubois",livreur:"Livreur Délices & Co",nguyen:"Mme Nguyen",rossi:"M. Rossi",dumont:"Mme Dumont",lefevre:"M. Lefèvre"};
const STAFF=["Mme Fontaine","M. Martin","Mme Collin","M. Peeters"];
const BADGES=["V1","V2","V3","V4","V5"];
const AGENDA=[
 ["09:00","M. Dubois (client, société Arvel)","Rendez-vous avec Mme Fontaine · salle Horizon"],
 ["09:15","Mme Nguyen (prestataire son et lumière)","Rendez-vous avec M. Martin, service événements"],
 ["09:30","Livraison du traiteur Délices & Co","Réception à l'accueil : vérifier 40 plateaux avant de signer"],
 ["10:00","M. Lefèvre (candidat)","Entretien d'embauche avec Mme Fontaine"]];
const NOTES=[
 "Mme Fontaine est en réunion jusqu'à 9 h 10.",
 "M. Martin est absent ce matin : c'est Mme Collin qui reçoit ses rendez-vous.",
 "Salle Horizon : 1er étage, à gauche en sortant de l'ascenseur.",
 "Tout visiteur qui entre dans les bureaux est inscrit au registre et reçoit un badge (V1, V2… dans l'ordre)."];
/* cat : r = relation et accueil · o = organisation (agenda, registre, priorités) · d = discrétion et sécurité */
const MOMENTS=[
{t:"08:58",hall:["dubois"],
 sit:"Tu viens de t'installer à ton poste. Un homme en costume entre et s'approche du comptoir. Tu le reconnais : c'est M. Dubois, un client fidèle de NOVELYS.",
 tasks:[
  {type:"choice",v:"dubois",cat:"r",q:"Comment l'accueilles-tu ?",opts:[
   ["(Je me lève et je souris.) « Bonjour Monsieur Dubois, ravi de vous revoir. Vous avez rendez-vous à 9 h avec Mme Fontaine, c'est bien cela ? »",10,"Variante « visiteur connu », et tu as anticipé grâce à l'agenda : il n'a rien à répéter."],
   ["(Je me lève.) « Bonjour Monsieur. Avec qui avez-vous rendez-vous ? »",5,"Correct, mais l'agenda l'annonçait : un client fidèle apprécie d'être reconnu."],
   ["(Je reste assis.) « Bonjour, c'est pour quoi ? »",1,"Posture assise et formule sèche : mauvaise première impression."]]},
  {type:"choice",v:"dubois",cat:"o",q:"Consulte l'agenda et les notes. Que lui dis-tu ensuite ?",opts:[
   ["« Mme Fontaine termine une réunion : elle sera disponible vers 9 h 10. Je vous invite à patienter en salle d'attente. Puis-je vous proposer un café ? »",10,"Délai précis, siège, boisson : l'attente est bien gérée."],
   ["« Je la préviens, elle arrive tout de suite. »",3,"C'est faux : elle est en réunion jusqu'à 9 h 10. Une promesse non tenue agace davantage."],
   ["« Elle est en réunion budget avec la direction, et ça chauffe : ça peut durer. »",0,"Confidentialité : on ne parle jamais des réunions internes."]]},
  {type:"reg",v:"dubois",cat:"o",a:{nom:"dubois",heure:"08:58",pers:"Mme Fontaine",badge:"V1"}}]},
{t:"09:05",hall:["dubois","livreur"],
 sit:"Le téléphone sonne. Au même moment, un livreur entre avec des caisses : « Livraison du traiteur Délices & Co ! Je suis en avance, vous pouvez me signer ça tout de suite ? » M. Dubois patiente en salle d'attente.",
 tasks:[
  {type:"choice",v:"livreur",cat:"o",q:"Comment t'organises-tu ?",opts:[
   ["Je salue le livreur (« Bonjour, je suis à vous dans un instant »), je réponds à l'appel en le traitant rapidement, puis je m'occupe de la livraison.",10,"Tout le monde est salué, puis tu traites dans l'ordre, rapidement."],
   ["Je réponds au téléphone en faisant signe au livreur d'attendre, sans un mot.",5,"L'ordre est bon, mais on salue toujours verbalement."],
   ["Je laisse sonner le téléphone : le livreur est là.",4,"Un appel manqué, c'est peut-être un client perdu. On peut saluer le livreur et prendre l'appel brièvement."],
   ["Je dis au livreur de revenir à 9 h 30, comme prévu dans l'agenda.",1,"Trop rigide : un livreur se traite rapidement, sans brusquerie."]]},
  {type:"choice",v:"livreur",cat:"o",q:"Le bon de livraison indique 40 plateaux. Tu comptes : il y en a 38. Le livreur s'impatiente.",opts:[
   ["Je signe en indiquant calmement « 38 plateaux reçus sur 40 » et je garde une copie du bon.",10,"Pour un livreur : vérifier ce qui doit être signé. La réserve protège NOVELYS."],
   ["Je signe sans rien noter : il est pressé.",0,"NOVELYS paierait 2 plateaux jamais reçus."],
   ["Je refuse toute la livraison.",2,"Trop radical : les 38 plateaux sont là et on en a besoin."],
   ["Je lui dis sèchement : « Attendez, je ne suis pas disponible. »",0,"C'est exactement le scénario 4 de ton support : à éviter."]]}]},
{t:"09:10",hall:["dubois"],
 msg:"Message de Mme Fontaine : « Ma réunion est terminée, tu peux m'envoyer M. Dubois. »",
 sit:"M. Dubois patiente en salle d'attente avec son café.",
 tasks:[
  {type:"choice",v:"dubois",cat:"r",q:"Comment prends-tu en charge M. Dubois ? (Consulte les notes.)",opts:[
   ["Je vais vers lui : « Mme Fontaine vous attend. » Je lui remets son badge V1, je l'accompagne jusqu'à l'ascenseur et je lui indique : « Salle Horizon, au 1er étage, à gauche en sortant de l'ascenseur. »",10,"Il est orienté précisément et accompagné : il ne sera jamais perdu."],
   ["Depuis mon poste : « C'est bon, c'est la salle Horizon ! »",3,"Sans indication ni badge, le visiteur est livré à lui-même."],
   ["« Vous pouvez monter, vous trouverez. »",0,"Le visiteur risque de se perdre, et il n'a pas son badge."]]}]},
{t:"09:15",hall:["nguyen"],
 sit:"Une femme entre avec une valise de matériel : « Bonjour, Anh Nguyen, de la société SonoPlus. J'ai rendez-vous à 9 h 15 avec M. Martin. »",
 tasks:[
  {type:"choice",v:"nguyen",cat:"o",q:"Consulte l'agenda et les notes. Que lui réponds-tu ?",opts:[
   ["« Bonjour Madame Nguyen, bienvenue chez NOVELYS. M. Martin est absent ce matin : c'est Mme Collin qui vous recevra à sa place. Je la préviens de votre arrivée. »",10,"Tu as lu les notes, tu annonces le changement clairement et positivement."],
   ["« Bonjour, je préviens M. Martin. »",2,"Tu n'as pas vérifié les notes : M. Martin est absent."],
   ["« M. Martin n'est pas là. Revenez un autre jour. »",0,"Faux, négatif, et une alternative existait."],
   ["« M. Martin est malade, il a la grippe depuis lundi. »",0,"Confidentialité : l'état de santé d'un collègue ne regarde pas les visiteurs."]]},
  {type:"reg",v:"nguyen",cat:"o",a:{nom:"nguyen",heure:"09:15",pers:"Mme Collin",badge:"V2"}}]},
{t:"09:20",hall:["nguyen","rossi"],
 sit:"Mme Nguyen patiente en salle d'attente. Un homme entre d'un pas pressé : « Bonjour. Je veux voir le directeur, tout de suite. C'est important. » Il n'est pas dans l'agenda.",
 tasks:[
  {type:"choice",v:"rossi",cat:"r",q:"Que lui réponds-tu ?",opts:[
   ["« Bonjour Monsieur, bienvenue chez NOVELYS. Je m'appelle [ton prénom]. Pouvez-vous me dire à quel sujet vous souhaitez le rencontrer ? »",10,"Formule en 3 temps : saluer, se présenter, identifier le motif. Une question ouverte, sans jugement."],
   ["« Je l'appelle tout de suite ! »",3,"On n'oriente jamais un visiteur sans avoir vérifié qui il est et pourquoi il vient."],
   ["« Vous avez rendez-vous ? Non ? Alors ce n'est pas possible. »",1,"Réponse fermée et négative : le visiteur sans rendez-vous mérite la même courtoisie."]]},
  {type:"choice",v:"rossi",cat:"r",q:"« Marc Rossi, de la société Bureau+. Je veux lui présenter nos nouvelles imprimantes. Ça ne prendra que cinq minutes. »",opts:[
   ["« Si je comprends bien, vous souhaitez présenter vos imprimantes à la direction. Le directeur reçoit uniquement sur rendez-vous : je vous propose de me laisser vos coordonnées et votre documentation, je les lui transmets dès aujourd'hui. »",10,"Reformulation, formulation positive et alternative concrète : c'est la bonne attitude avec un visiteur sans rendez-vous."],
   ["« Donnez-moi votre catalogue, je le mettrai quelque part. »",3,"Il repart sans savoir ce que deviendra sa demande."],
   ["« Attendez ici, il finira bien par descendre. »",2,"Fausse promesse : le directeur ne descendra pas pour lui."],
   ["« Le directeur n'a pas de temps pour ce genre de choses. »",0,"Désagréable, et ce n'est pas à toi d'en juger."]]}]},
{t:"09:28",hall:["nguyen","rossi"],
 sit:"M. Rossi remplit une fiche de contact au comptoir. Il se penche vers toi : « Et la dame, là-bas, c'est SonoPlus, non ? Ils préparent quel événement avec vous ? » Tu remarques que ton écran, tourné vers le comptoir, affiche l'agenda du jour.",
 tasks:[
  {type:"choice",v:"rossi",cat:"d",q:"Que lui réponds-tu ?",opts:[
   ["« Je ne peux pas vous renseigner sur nos autres visiteurs. Avez-vous bien noté votre numéro de téléphone sur la fiche ? »",10,"Discret et courtois : tu ne donnes rien, et tu ramènes la conversation à sa demande."],
   ["« Ça ne vous regarde pas ! »",3,"Le fond est juste, mais le ton est agressif."],
   ["« Oui, ils s'occupent de la sono de la soirée de gala de la société Arvel. »",0,"Tu divulgues deux informations confidentielles à un inconnu."]]},
  {type:"choice",cat:"d",q:"Et ton écran ?",opts:[
   ["Je réduis la fenêtre de l'agenda, ou je tourne discrètement l'écran hors de sa vue.",10,"Les écrans restent hors du champ de vision des visiteurs."],
   ["Je lui demande de ne pas regarder mon écran.",3,"Maladroit : c'est à toi de protéger l'information, pas au visiteur."],
   ["Je ne change rien : il ne va pas lire.",0,"Il vient justement de montrer qu'il est curieux."]]}]},
{t:"09:40",hall:["nguyen"],
 sit:"Mme Collin a du retard. Mme Nguyen attend depuis 25 minutes. Elle se lève, s'approche du comptoir et hausse le ton : « On m'avait dit cinq minutes ! J'ai d'autres clients, moi ! Si ça continue, je m'en vais ! »",
 tasks:[
  {type:"desc",v:"nguyen",cat:"r",q:"Construis ta réponse avec la méthode DESC : choisis la bonne phrase pour chaque lettre. Deux phrases du lot sont à éviter.",
   a:{D:"Vous attendez depuis vingt-cinq minutes, alors qu'on vous avait annoncé cinq minutes.",E:"Je comprends que cette attente soit vraiment gênante pour votre organisation.",S:"J'appelle Mme Collin tout de suite pour savoir quand elle peut vous recevoir.",C:"Vous aurez une réponse précise dans deux minutes, et je vous tiens informée."},
   extra:["Calmez-vous, Madame, tout le monde attend ici.","Ce n'est pas de ma faute, c'est Mme Collin qui est en retard."]},
  {type:"choice",v:"nguyen",cat:"r",q:"Mme Collin ne répond pas. Mme Nguyen reprend sa valise pour partir.",opts:[
   ["Je fais appel à la responsable du service événements pour qu'elle reçoive Mme Nguyen ou qu'elle trouve une solution.",10,"Savoir passer la main n'est jamais un échec : c'est un réflexe professionnel."],
   ["Je lui promets que Mme Collin arrive dans une minute, même si je n'en sais rien.",0,"Une nouvelle promesse non tenue aggraverait tout."],
   ["Je la laisse partir : j'ai fait ce que j'ai pu.",2,"Une solution existait : faire intervenir quelqu'un d'autre."]]}]},
{t:"09:50",hall:["dumont"],
 msg:"La responsable du service événements est descendue : Mme Nguyen est enfin reçue.",
 sit:"Une dame âgée entre doucement, avec une canne : « Bonjour… je viens m'inscrire à l'après-midi portes ouvertes de NOVELYS… » Elle t'entend mal et te fait répéter.",
 tasks:[
  {type:"choice",v:"dumont",cat:"r",q:"Comment adaptes-tu ton accueil ?",opts:[
   ["Je me lève, je lui propose un siège, et je lui parle face à elle, plus lentement et en articulant, sans crier.",10,"On adapte le rythme, sans jamais hausser le ton pour se faire comprendre ni infantiliser."],
   ["Je répète la même phrase, beaucoup plus fort.",2,"Hausser le ton est à éviter : ralentir et articuler est plus efficace."],
   ["Je parle vite, pour ne pas la retenir trop longtemps.",0,"C'est l'inverse de ce qu'il faut : on ralentit le débit."]]},
  {type:"choice",v:"dumont",cat:"r",q:"Elle ne comprend pas bien comment se passe l'inscription.",opts:[
   ["Je reformule simplement, puis je lui écris les informations importantes sur une feuille (date, heure, adresse).",10,"Reformuler et s'appuyer sur un support écrit : elle repart avec tout ce qu'il faut."],
   ["Je lui donne une brochure et je retourne à mon écran.",3,"La brochure aide, mais tu la laisses seule avec ses questions."],
   ["Je lui dis : « Tout est sur le site Internet, Madame. »",1,"Tu la renvoies ailleurs, peut-être vers un outil qu'elle n'utilise pas."]]}]},
{t:"10:00",hall:["lefevre"],
 msg:"Message de Mme Fontaine (9 h 55) : « Ma réunion avec M. Dubois se prolonge jusqu'à 10 h 15. Si M. Lefèvre arrive, fais-le patienter. »",
 note:"Mme Fontaine (9 h 55) : réunion avec M. Dubois prolongée jusqu'à 10 h 15.",
 sit:"Un jeune homme en costume entre, visiblement stressé : « Bonjour, Julien Lefèvre. J'ai un entretien avec Mme Fontaine à 10 h. »",
 tasks:[
  {type:"choice",v:"lefevre",cat:"r",q:"Que lui dis-tu ?",opts:[
   ["« Bonjour Monsieur Lefèvre, bienvenue chez NOVELYS. Mme Fontaine termine une réunion : elle pourra vous recevoir vers 10 h 15, dans un quart d'heure environ. Je vous invite à vous installer en salle d'attente. Puis-je vous proposer un verre d'eau ? »",10,"Accueil, délai précis, siège et boisson : c'est l'exercice 4 de ton support, parfaitement réussi."],
   ["« Elle est en retard. Asseyez-vous. »",3,"Formule négative et sèche, sans délai précis."],
   ["« Mme Fontaine est encore avec M. Dubois, de la société Arvel. Ça s'éternise ! »",0,"Confidentialité : on ne parle pas des autres rendez-vous."]]},
  {type:"reg",v:"lefevre",cat:"o",a:{nom:"lefèvre",alt:"lefevre",heure:"10:00",pers:"Mme Fontaine",badge:"V3"}}]},
{t:"10:12",hall:["lefevre","dubois"],
 sit:"M. Dubois redescend de sa réunion et s'approche du comptoir pour partir. Il te rend son badge. M. Lefèvre attend depuis 12 minutes en salle d'attente.",
 tasks:[
  {type:"choice",v:"dubois",cat:"r",q:"Comment prends-tu congé de M. Dubois ?",opts:[
   ["(Je me lève et je souris.) « Merci Monsieur Dubois. Tout s'est bien passé ? Je vous souhaite une excellente journée, à bientôt chez NOVELYS ! »",10,"Clôture soignée : tu t'assures que tout s'est bien passé. C'est la dernière impression."],
   ["(Assis, avec un sourire.) « Merci, bonne journée. »",6,"Poli, mais sans te lever ni vérifier que tout s'est bien passé."],
   ["« Au revoir. » (sans lever les yeux de l'écran)",0,"Une visite réussie qui se termine sur un ton froid."]]},
  {type:"choice",v:"lefevre",cat:"r",q:"Mme Fontaine t'indique qu'elle descend dans trois minutes. Et M. Lefèvre ?",opts:[
   ["Je vais vers lui : « Mme Fontaine arrive dans trois minutes. Merci pour votre patience. »",10,"On informe de tout délai : il ne se sent pas oublié, et son stress diminue."],
   ["Je lui dis depuis mon poste : « Ça ne devrait plus être très long. »",5,"Trop vague : donne un délai précis."],
   ["Rien : il sait qu'il doit attendre jusqu'à 10 h 15.",4,"Un visiteur stressé apprécie d'avoir des nouvelles."]]}]},
{t:"10:25",hall:["nguyen"],
 sit:"Mme Nguyen repart, contente de son rendez-vous. Elle se dirige vers la sortie… avec son badge V2 encore accroché à sa veste.",
 tasks:[
  {type:"choice",v:"nguyen",cat:"d",q:"Que fais-tu ?",opts:[
   ["(Je me lève.) « Merci pour votre visite, Madame Nguyen, et encore désolé(e) pour l'attente. Puis-je vous reprendre votre badge ? Bonne journée ! »",10,"Clôture chaleureuse, excuses pour l'attente, et le badge est récupéré en toute courtoisie."],
   ["« Hé ! Le badge ! »",3,"Le badge est récupéré, mais la dernière impression est ratée."],
   ["Je la laisse partir : elle le renverra.",2,"Un badge perdu permet d'entrer dans les bureaux : c'est une question de sécurité."]]},
  {type:"choice",cat:"d",q:"Ton service se termine. Que fais-tu du registre des visiteurs ?",opts:[
   ["Je complète les heures de départ, je vérifie que les badges V1 à V3 sont rentrés, et je range le registre hors de la vue des visiteurs.",10,"Le registre est à jour et protégé : il contient des informations sur tous les visiteurs."],
   ["Je le laisse ouvert sur le comptoir pour le collègue suivant.",2,"N'importe quel visiteur pourrait le lire."],
   ["Je le jette : les visites sont terminées.",0,"Le registre doit être conservé : c'est une trace officielle."]]}]}
];
const MAXV={}; MOMENTS.forEach(m=>m.tasks.forEach(t=>{ if(t.v) MAXV[t.v]=(MAXV[t.v]||0)+10; }));
const NTASK=MOMENTS.reduce((a,m)=>a+m.tasks.length,0);

let S={phase:"start",m:0,k:0,sc:{r:[0,0],o:[0,0],d:[0,0]},v:{},reg:[],notes:[]};
try{const s=localStorage.getItem(KEY); if(s) S=Object.assign(S,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
function normTime(s){ const m=String(s).replace(/\s/g,"").replace(/[hH.]/,":").match(/^(\d{1,2}):?(\d{2})$/); return m?m[1].padStart(2,"0")+":"+m[2]:""; }
function satOf(id){ const x=S.v[id]; return x?Math.round(x[0]/x[1]*100):70; }
function satLabel(p){ return p>=85?["Ravi","#237A4B"]:p>=65?["Satisfait","#5AA05A"]:p>=45?["Mitigé","#C9A227"]:["Mécontent","#B3261E"]; }
let tab="hall";

function side(hallIds){
  const tabs=[["hall","Le hall"],["agenda","Agenda"],["reg","Registre"]];
  let body="";
  if(tab==="hall") body=`<h3>Présents dans le hall</h3>${hallIds.length?hallIds.map(id=>{const p=satOf(id),[l,c]=satLabel(p);return `<div class="vis"><b>${esc(VIS[id])}</b><small>${S.v[id]?"Humeur : "+l:"Vient d'arriver"}</small><div class="sat"><div style="width:${S.v[id]?p:0}%;background:${c}"></div></div></div>`;}).join(""):`<p class="empty">Le hall est vide pour l'instant.</p>`}`;
  if(tab==="agenda") body=`<h3>Agenda partagé du jour</h3>${AGENDA.map(a=>`<div class="ag"><span class="h">${a[0]}</span> <b>${esc(a[1])}</b><br>${esc(a[2])}</div>`).join("")}<h3 style="margin-top:12px">Notes internes</h3>${NOTES.concat(S.notes).map((n,i)=>`<div class="note ${i>=NOTES.length?"new":""}">${esc(n)}</div>`).join("")}`;
  if(tab==="reg") body=`<h3>Registre des visiteurs</h3>${S.reg.length?`<table class="reg"><tr><th>Nom</th><th>Arrivée</th><th>Visite</th><th>Badge</th></tr>${S.reg.map(r=>`<tr><td>${esc(r.nom)}</td><td>${esc(r.heure)}</td><td>${esc(r.pers)}</td><td>${esc(r.badge)}</td></tr>`).join("")}</table>`:`<p class="empty">Aucune inscription pour l'instant.</p>`}`;
  return `<aside class="side"><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join("")}</div><div class="card panel">${body}</div></aside>`;
}
function bindTabs(hallIds){ document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; const s=document.querySelector(".side"); s.outerHTML=side(hallIds); bindTabs(hallIds); }); }

function start(){
  $("#clock").hidden=true;
  app.innerHTML=`<section class="card hero"><h1>Le hall en <span>effervescence</span></h1>
    <p>C'est ta première matinée seul(e) à l'accueil de NOVELYS, de 8 h 58 à 10 h 25. Les visiteurs vont se succéder, parfois en même temps : clients, livreur, visiteur sans rendez-vous, cliente mécontente, personne âgée, candidat stressé… Tout ce que tu as appris dans ton support théorique sur l'accueil va te servir.</p>
    <ul class="rules">
      <li>À droite, trois onglets : <b>le hall</b> (qui attend, et de quelle humeur), <b>l'agenda partagé</b> (les rendez-vous et les notes internes) et <b>le registre</b> des visiteurs. Consulte-les souvent : les réponses s'y trouvent.</li>
      <li>Tu devras remplir toi-même le registre : nom, heure d'arrivée, personne visitée et numéro de badge.</li>
      <li>Une seule tentative par décision. L'explication s'affiche ensuite.</li>
      <li>Mme Fontaine t'évaluera sur trois points : la relation, l'organisation, la discrétion. Il faut 75 % pour débloquer la mission finale.</li>
    </ul><p>Environ 45 minutes.</p>
    <div class="actions"><button class="btn" id="go">${S.phase==="play"?"Reprendre ma matinée":"Prendre mon poste"}</button></div></section>`;
  $("#go").onclick=()=>{ if(S.phase!=="play") S={phase:"play",m:0,k:0,sc:{r:[0,0],o:[0,0],d:[0,0]},v:{},reg:[],notes:[]}; tab="hall"; save(); render(); };
}
function moment(){
  const M=MOMENTS[S.m], t=M.tasks[S.k];
  if(M.note && !S.notes.includes(M.note)){ S.notes.push(M.note); save(); }
  $("#clock").hidden=false; $("#clock").textContent=M.t.replace(":"," h ");
  let task=`<div class="task"><p class="q">${esc(t.q||"Inscris ce visiteur au registre. (Consulte l'agenda et le registre si besoin.)")}</p>`;
  let sh;
  if(t.type==="choice"){ sh=shuffle(t.opts); task+=sh.map((o,j)=>`<label class="opt"><input type="radio" name="c" value="${j}"><span>${esc(o[0])}</span></label>`).join(""); }
  if(t.type==="reg") task+=`<div class="grid2">
    <div class="fld"><label for="rn">Nom du visiteur</label><input type="text" id="rn" autocomplete="off"></div>
    <div class="fld"><label for="rh">Heure d'arrivée (ex. 09:15)</label><input type="text" id="rh" autocomplete="off"></div>
    <div class="fld"><label for="rp">Personne visitée</label><select id="rp"><option value="">— Choisis —</option>${STAFF.map(s=>`<option>${s}</option>`).join("")}</select></div>
    <div class="fld"><label for="rb">Badge remis</label><select id="rb"><option value="">— Choisis —</option>${BADGES.map(s=>`<option>${s}</option>`).join("")}</select></div></div>`;
  if(t.type==="desc"){ sh=shuffle(Object.values(t.a).concat(t.extra));
    task+=`<div class="desc" style="display:grid;gap:10px">${["D","E","S","C"].map(L=>`<div class="fld"><label for="d${L}">${L}</label><select id="d${L}"><option value="">— Choisis la phrase —</option>${sh.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div>`).join("")}</div>`; }
  task+=`<p class="warn" id="w"></p><div id="out"></div><div class="actions"><button class="btn" id="val">Valider</button></div></div>`;
  app.innerHTML=`<div class="layout"><section class="card">
    <p style="margin:0 0 10px;color:var(--muted);font-size:15px">Moment ${S.m+1} sur ${MOMENTS.length} · décision ${S.k+1} sur ${M.tasks.length}</p>
    ${M.msg?`<div class="msg">${esc(M.msg)}</div>`:""}<div class="sit"><p>${esc(M.sit)}</p></div>${task}</section>${side(M.hall)}</div>`;
  bindTabs(M.hall);
  $("#val").onclick=()=>{
    let pts=0, lines=[];
    if(t.type==="choice"){
      const c=document.querySelector("input[name=c]:checked"); if(!c){ $("#w").textContent="Choisis une réponse."; return; }
      const o=sh[+c.value], max=Math.max(...t.opts.map(x=>x[1])); pts=o[1];
      document.querySelectorAll("input[name=c]").forEach((i,j)=>{ i.disabled=true; if(sh[j][1]===max) i.parentNode.classList.add("best"); else if(i===c) i.parentNode.classList.add("bad"); });
      lines.push(o[2]); if(pts<max) lines.push("La meilleure réponse est encadrée en vert.");
    }
    if(t.type==="reg"){
      const f={nom:$("#rn").value,heure:$("#rh").value,pers:$("#rp").value,badge:$("#rb").value};
      if(!f.nom.trim()||!f.heure.trim()||!f.pers||!f.badge){ $("#w").textContent="Remplis toutes les cases du registre."; return; }
      const okN=norm(f.nom).includes(norm(t.a.nom))||(t.a.alt&&norm(f.nom).includes(t.a.alt));
      const okH=normTime(f.heure)===t.a.heure, okP=f.pers===t.a.pers, okB=f.badge===t.a.badge;
      [["rn",okN],["rh",okH],["rp",okP],["rb",okB]].forEach(([id,ok])=>{ const e=$("#"+id); e.disabled=true; e.classList.add(ok?"ok-f":"ko-f"); });
      pts=[okN,okH,okP,okB].filter(Boolean).length*2.5;
      const nomAff=VIS[t.v].replace(/^(M\.|Mme) /,"");
      S.reg.push({nom:nomAff,heure:t.a.heure.replace(":"," h "),pers:t.a.pers,badge:t.a.badge});
      if(!okN) lines.push(`Nom : ${nomAff}.`);
      if(!okH) lines.push(`Heure d'arrivée : ${t.a.heure}, l'heure affichée en haut de l'écran.`);
      if(!okP) lines.push(`Personne visitée : ${t.a.pers}.${t.a.pers==="Mme Collin"?" Relis les notes : M. Martin est absent, c'est Mme Collin qui reçoit ses rendez-vous.":""}`);
      if(!okB) lines.push(`Badge : ${t.a.badge}, le premier numéro libre dans l'ordre (regarde l'onglet Registre).`);
      if(pts===10) lines.push("Registre parfaitement tenu : nom, heure, personne visitée et badge.");
      else lines.push("Le registre a été corrigé automatiquement : consulte l'onglet Registre.");
    }
    if(t.type==="desc"){
      const vals={}; let miss=false; ["D","E","S","C"].forEach(L=>{ vals[L]=$("#d"+L).value; if(!vals[L]) miss=true; });
      if(miss){ $("#w").textContent="Choisis une phrase pour chaque lettre."; return; }
      ["D","E","S","C"].forEach(L=>{ const e=$("#d"+L); e.disabled=true; const ok=vals[L]===t.a[L]; if(ok) pts+=2.5; e.classList.add(ok?"ok-f":"ko-f");
        if(!ok) lines.push(`${L} : « ${t.a[L]} »`); });
      if(t.extra.some(x=>Object.values(vals).includes(x))) lines.push("Attention : tu as utilisé une phrase à éviter. On ne répond jamais sur le même registre, et on ne prend pas la colère pour soi.");
      lines.push("D : décrire les faits sans jugement. E : exprimer le ressenti. S : spécifier une solution concrète. C : annoncer la conséquence positive.");
    }
    S.sc[t.cat][0]+=pts; S.sc[t.cat][1]+=10;
    if(t.v){ S.v[t.v]=S.v[t.v]||[0,0]; S.v[t.v][0]+=pts; S.v[t.v][1]+=10; }
    S.k++; if(S.k>=M.tasks.length){ S.k=0; S.m++; } save();
    $("#w").remove(); $("#val").remove();
    const cls=pts>=8?"good":pts>=5?"mid":"bad";
    $("#out").innerHTML=`<div class="fb ${cls}" role="status"><strong>+${String(pts).replace(".",",")} / 10</strong>${lines.map(l=>`<p style="margin:4px 0">${esc(l)}</p>`).join("")}</div>
      <div class="actions"><button class="btn" id="nx">${S.m>=MOMENTS.length?"Voir mon évaluation →":"Suite →"}</button></div>`;
    const s=document.querySelector(".side"); s.outerHTML=side(M.hall); bindTabs(M.hall);
    $("#nx").onclick=render; $("#nx").focus();
  };
}
function end(){
  $("#clock").hidden=true;
  const P=c=>S.sc[c][1]?Math.round(S.sc[c][0]/S.sc[c][1]*100):0;
  const tot=Math.round((S.sc.r[0]+S.sc.o[0]+S.sc.d[0])/(NTASK*10)*100);
  const title=tot>=90?"Hôte d'accueil d'excellence":tot>=75?"Hôte d'accueil confirmé":tot>=55?"Hôte d'accueil en progrès":"Encore en formation";
  const word=tot>=75?"« Une matinée difficile, et tu l'as gérée comme un professionnel. Bravo ! »":"« Il y a eu des moments délicats. Relis ton support, et on refait une matinée ensemble. »";
  app.innerHTML=`<section class="card hero"><span class="tag" style="background:var(--orange)">${title}</span>
    <h1 style="margin-top:14px">${tot} %</h1><p>Mme Fontaine : ${esc(word)}</p>
    <div class="cats"><div><strong>${P("r")} %</strong>Relation et accueil</div><div><strong>${P("o")} %</strong>Organisation : agenda, registre, priorités</div><div><strong>${P("d")} %</strong>Discrétion et sécurité</div></div>
    <h3>Comment les visiteurs sont repartis</h3>
    <table class="rec">${Object.keys(MAXV).map(id=>`<tr><td>${esc(VIS[id])}</td><td>${satLabel(satOf(id))[0]}</td></tr>`).join("")}</table>
    <div class="actions"><button class="btn ghost" id="again">Refaire la matinée</button></div></section>
    ${tot>=75?`<section class="card" style="margin-top:18px;border-left:6px solid var(--ok)"><h2 style="font-size:28px">Mission finale : le rapport de matinée</h2>
      <p><b>1. Dans Excel</b>, recrée le registre des visiteurs de la matinée.</p>
      <div class="check">${["Colonnes : nom, société, heure d'arrivée, heure de départ, personne visitée, badge","Les 3 visiteurs inscrits, avec leurs vraies heures (départs : M. Dubois 10 h 12, Mme Nguyen 10 h 25, M. Lefèvre à compléter)","Une colonne « Durée de la visite » calculée par une formule (départ − arrivée)","Titres en gras, bordures, filtre sur la ligne de titres"].map(x=>`<label><input type="checkbox"> ${x}</label>`).join("")}</div>
      <p><b>2. Dans Word</b>, rédige un court rapport pour Mme Fontaine sur les incidents de la matinée.</p>
      <div class="check">${["Titre, date, ton nom","La livraison incomplète (38 plateaux sur 40) et ce que tu as fait","La visite de M. Rossi sans rendez-vous et la suite à donner","L'attente de Mme Nguyen : les faits, ta réaction, et une proposition pour éviter que ça se reproduise","Un style professionnel : phrases complètes, vocabulaire du support, zéro faute"].map(x=>`<label><input type="checkbox"> ${x}</label>`).join("")}</div>
      <p><b>Quand tout est coché, lève la main et montre tes deux fichiers au professeur.</b></p></section>`
    :`<section class="card" style="margin-top:18px"><h2 style="font-size:26px">Mission finale verrouillée</h2><p>Atteins au moins 75 % pour la débloquer. Les réponses sont mélangées à chaque nouvelle matinée.</p></section>`}`;
  $("#again").onclick=()=>{S={phase:"play",m:0,k:0,sc:{r:[0,0],o:[0,0],d:[0,0]},v:{},reg:[],notes:[]};tab="hall";save();render();};
}
function render(){
  if(S.phase==="play" && S.m>=MOMENTS.length) S.phase="end";
  save();
  if(S.phase==="start") start(); else if(S.phase==="end") end(); else moment();
  window.scrollTo(0,0);
}
$("#reset").onclick=()=>{ if(!confirm("Effacer la matinée en cours ?")) return; S={phase:"start",m:0,k:0,sc:{r:[0,0],o:[0,0],d:[0,0]},v:{},reg:[],notes:[]}; save(); render(); };
if(S.phase==="play") start(); else render();
</script>
</body>
</html>
