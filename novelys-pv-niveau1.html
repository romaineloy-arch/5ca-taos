<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La réunion en direct — Novelys, la prise de notes en réunion, niveau 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --card:#FFFFFF; --ink:#1A2740; --muted:#56627A; --line:#CBD3E0;
  --navy:#1F3A63; --navy-ink:#FFFFFF; --orange:#E07B2E; --orange-soft:#FCEBDD;
  --paper:#FBFAF6; --kraft:#D9B98A; --kraft-ink:#3B2A14;
  --urg:#C8372D; --conf:#6A4BB0; --pro:#1F7A6E; --pub:#9A7A10;
  --ok:#237A4B; --ok-bg:#E3F3E8; --mid:#8A6100; --mid-bg:#FFF1CF; --err:#B3261E; --err-bg:#FBE6E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#10182A; --card:#1A2439; --ink:#E6EBF4; --muted:#9FAAC0; --line:#33415C; --navy:#2A4C80; --orange-soft:#3F2A18; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
}
:root[data-theme="dark"]{ --bg:#10182A; --card:#1A2439; --ink:#E6EBF4; --muted:#9FAAC0; --line:#33415C; --navy:#2A4C80; --orange-soft:#3F2A18; --ok:#5CC48A; --ok-bg:#1B3A29; --mid:#E6B94A; --mid-bg:#3D3014; --err:#F08A80; --err-bg:#43221F; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.12;margin:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
select{padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--card);max-width:100%;width:100%}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:18px 18px 40px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;color:var(--navy)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo{color:#9DB9E6} }
.logo::before{content:"";display:inline-block;width:10px;height:10px;background:var(--orange);margin-right:6px;vertical-align:4px}
.logo small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:12px;color:var(--orange);letter-spacing:.08em;text-transform:uppercase}
.tag{background:var(--navy);color:var(--navy-ink);font-size:14px;font-weight:700;padding:4px 12px;border-radius:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.hero{background:var(--navy);color:var(--navy-ink);border:0}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:800}
.hero h1 span{color:var(--orange)}
.hero p{max-width:64ch}

/* Les postes de la salle du courrier */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:18px}
.post{position:relative;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:16px 18px;min-height:150px}
.post[disabled]{opacity:.5;cursor:not-allowed}
.post.next{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.post .n{font-size:14px;color:var(--orange);font-weight:700}
.post h3{font-size:22px;margin:4px 0 6px}
.post p{margin:0;font-size:15.5px;color:var(--muted)}
.stamps{position:absolute;right:12px;top:12px;display:flex;gap:4px}
.stamp{width:26px;height:30px;border:2px dashed var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.stamp.on{border-style:solid;border-color:var(--urg);background:#FCE3DF;color:var(--urg)}
.total{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;margin-top:16px}

/* Enveloppes */
.env{position:relative;margin:0 auto 18px;max-width:560px;aspect-ratio:22/11;background:var(--paper);color:#1d1d1d;border:1px solid #cfc8b8;border-radius:6px;box-shadow:0 14px 26px -18px rgba(0,0,0,.6);padding:16px 18px;font-size:15px}
.env.kraft{background:var(--kraft);color:var(--kraft-ink);border-color:#b8986a}
.env.gloss{background:linear-gradient(135deg,#FFE15A,#FF8A3D 55%,#FF4F8B);color:#2a0a14;border-color:#e05a3a}
.env.big{aspect-ratio:3/2}
.env .from{position:absolute;left:18px;top:14px;font-size:13px;line-height:1.3;max-width:50%}
.env .from b{font-size:14px}
.back{max-width:560px;margin:-8px auto 18px;background:var(--paper);color:#1d1d1d;border:1px solid #cfc8b8;border-top:0;border-radius:0 0 10px 10px;padding:10px 16px;font-size:15px;text-align:center;clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}
.back .lbl{color:#6b6150;font-style:italic}
.env .mention{position:absolute;left:18px;top:22px;max-width:58%;font-weight:800;font-size:15px;color:#9b1c14;border:2px solid #9b1c14;padding:2px 8px;transform:rotate(-2deg);background:rgba(255,255,255,.4)}
.env .mention.soft{color:#1f2a44;border-color:transparent;transform:none;font-style:italic;font-weight:700;background:transparent;padding:0}
.env .post-stamp{position:absolute;right:16px;top:12px;width:50px;height:58px;border:2px dashed #b04a3c;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#b04a3c;background:#fff6f3}
.env .to{position:absolute;right:28px;bottom:20px;text-align:left;font-size:15px;line-height:1.35}
.env .fmt{position:absolute;left:18px;bottom:12px;font-size:12px;opacity:.75;font-style:italic}
.env .window{position:absolute;right:24px;bottom:16px;width:44%;height:36%;border:2px solid rgba(0,0,0,.25);border-radius:4px;background:rgba(255,255,255,.55);padding:6px 10px;font-size:14px}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bin{border:0;border-radius:10px;padding:14px 8px;color:#fff;font-weight:800;font-size:16px;line-height:1.2;min-height:76px}
.bin small{display:block;font-weight:400;font-size:12.5px;opacity:.9;margin-top:4px}
.bin:disabled{opacity:.35;cursor:default}
.bin.right{opacity:1;outline:4px solid var(--ok);outline-offset:2px}
.bin.wrong{opacity:1;outline:4px solid var(--err);outline-offset:2px}
.prog{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.prog span{width:20px;height:8px;border-radius:4px;background:var(--line)}
.prog span.ok{background:var(--ok)} .prog span.ko{background:var(--err)} .prog span.cur{background:var(--orange)}

/* Ordre */
.pool{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.chip{border:2px solid var(--line);background:var(--card);border-radius:30px;padding:9px 16px;font-weight:700}
.chip:disabled{opacity:.3;cursor:default}
.seq{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px;max-width:520px}
.seq li{display:flex;gap:12px;align-items:center;border:2px dashed var(--line);border-radius:8px;padding:8px 12px;min-height:44px}
.seq li b{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.seq li.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.seq li.ko{border-style:solid;border-color:var(--err);background:var(--err-bg)}
.seq li .fix{margin-left:auto;font-size:14px;color:var(--err)}

/* Enveloppe à zones */
.zones{position:relative;max-width:600px;aspect-ratio:22/11;margin:10px auto 16px;background:var(--paper);border:1px solid #cfc8b8;border-radius:6px;box-shadow:0 14px 26px -18px rgba(0,0,0,.6);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;padding:8px}
.zone{border:2px dashed #c9c0ad;border-radius:6px;background:transparent;color:#4a4436;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.zone:hover{background:rgba(224,123,46,.12);border-color:var(--orange)}
.zone.filled{border-style:solid;background:#fff;color:#1d1d1d}
.zone.right{border-color:var(--ok);background:var(--ok-bg)} .zone.wrong{border-color:var(--err);background:var(--err-bg)}
.faces{display:grid;grid-template-columns:3fr 2fr;gap:18px;align-items:start}
.face-t{text-align:center;font-weight:700;margin:0 0 4px;color:var(--muted);font-size:15px}
.zones.backz{grid-template-columns:1fr;grid-template-rows:1fr 1.4fr;aspect-ratio:22/14}
.zones.backz .zone:first-child{clip-path:polygon(0 0,100% 0,50% 100%);padding-bottom:30px}
@media (max-width:700px){.faces{grid-template-columns:1fr}}
.ask{font-size:20px;font-weight:700;text-align:center;margin:6px 0}
.ask span{color:var(--orange)}

.q{margin:18px 0 6px;font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--orange)}
.opt input{margin-top:4px;width:18px;height:18px;flex:none}
.opt.best{border-color:var(--ok);background:var(--ok-bg)} .opt.bad{border-color:var(--err)}
.row{display:grid;grid-template-columns:1fr minmax(180px,260px);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row .why{grid-column:1/-1;font-size:15px;color:var(--err)}
.good-sel{border-color:var(--ok)!important} .bad-sel{border-color:var(--err)!important}
.btn{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:12px 22px;font-weight:700;font-size:18px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.fb{border-radius:8px;padding:14px 16px;margin-top:14px}
.fb.good{background:var(--ok-bg)} .fb.mid{background:var(--mid-bg)} .fb.bad{background:var(--err-bg)}
.fb strong{display:block;font-size:19px;margin-bottom:4px}
.fb p{margin:4px 0}
.warn{color:var(--err);font-size:15px}
.small{font-size:15px;color:var(--muted)}
.data{background:var(--bg);border-left:5px solid var(--navy);border-radius:0 8px 8px 0;padding:12px 16px;margin:10px 0}
.check label{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:4px;flex:none}
footer{max-width:980px;margin:0 auto;padding:0 18px 36px;font-size:15px;color:var(--muted)}
footer a{color:inherit;font-weight:700}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:15px}
[hidden]{display:none!important}
@media (max-width:700px){.bins{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.env{font-size:13px}.env .mention{top:56px;font-size:13px}.env .to{font-size:13px;right:14px}}

.yn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.yn button{border:0;border-radius:10px;padding:14px 8px;font-weight:800;font-size:16px;color:#fff}
.yn button:disabled{opacity:.35}
.yn button.right{opacity:1;outline:4px solid var(--ok);outline-offset:2px} .yn button.wrong{opacity:1;outline:4px solid var(--err);outline-offset:2px}
.say{font-family:"Bricolage Grotesque",sans-serif;font-size:22px;text-align:center;border:2px dashed var(--line);border-radius:10px;padding:18px;margin:10px 0;background:var(--bg)}
.abbr{font-family:"Kalam",cursive;font-size:56px;text-align:center;margin:6px 0;color:var(--navy)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .abbr{color:#9DB9E6} }
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.three button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:12px 8px;font-weight:700;font-size:16px}
.three button.right{border-color:var(--ok);background:var(--ok-bg)} .three button.wrong{border-color:var(--err);background:var(--err-bg)}
/* Réunion en direct */
.meet{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.room{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:12px;min-height:380px;max-height:520px;overflow-y:auto}
.bub{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.av{flex:none;width:40px;height:40px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.bt{background:var(--card);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 12px;flex:1}
.bt b{font-size:14px;color:var(--muted);display:block}
.bt .nb{margin-top:6px;border:2px solid var(--orange);background:transparent;color:var(--orange);border-radius:20px;padding:3px 12px;font-weight:700;font-size:14px}
.bt .nb.on{background:var(--orange);color:#fff}
.bt .nb:disabled{opacity:.35;border-color:var(--line);color:var(--muted);cursor:default}
.bub.hit .bt{border-color:var(--ok);background:var(--ok-bg)} .bub.miss .bt{border-color:var(--err);outline:2px dashed var(--err)} .bub.false .bt{border-color:var(--err);background:var(--err-bg)}
.bt .why{font-size:13.5px;margin-top:4px}
.pad{border:1px solid #d9cfa9;border-radius:6px;background:#FFF9DC;color:#2b2410;padding:12px 14px;font-family:"Kalam",cursive;font-size:17px;min-height:200px;background-image:repeating-linear-gradient(transparent 0 27px,#e8dcae 27px 28px)}
.pad h4{margin:0 0 6px;font-family:"Bricolage Grotesque",sans-serif;font-size:16px}
.pad div{line-height:28px}
.ctrl{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
.qqq{width:100%;border-collapse:collapse;margin:10px 0}
.qqq th{background:var(--navy);color:#fff;padding:8px;text-align:left}
.qqq td{border:1px solid var(--line);padding:8px;vertical-align:middle}
.qqq td.ok select{border-color:var(--ok)} .qqq td.ko select{border-color:var(--err)}
.qqq .corr{font-size:13px;color:var(--err);margin-top:4px}
@media (max-width:760px){.meet{grid-template-columns:1fr}.yn,.three{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}
</style>
</head>

  <div id="app"></div>
</main>
